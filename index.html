<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        #d {
            width: 100px;
            height: 100px;
            border: 1px solid red;
            position: absolute;
        }
    </style>
</head>
<body>
<div id="d">拖动</div>
<script>
    window.onload = () => {
        let isDown = false
        let currOffsetY;
        let currOffsetX;
        const div = document.getElementById('d')
        div.addEventListener('mousemove', function (e) {
            if (isDown) {
                div.style.top = (e.clientY - currOffsetY) + 'px'
                div.style.left = (e.clientX - currOffsetX) + 'px'
            }
        })
        div.addEventListener('mousedown', function (e) {
            currOffsetY = e.offsetY
            currOffsetX = e.offsetX
            isDown = true
        })
        div.addEventListener('mouseup', function () {
            isDown = false
        })
        div.addEventListener('mouseleave', function() {
            isDown = false
        })
    }
</script>

</body>
</html>
